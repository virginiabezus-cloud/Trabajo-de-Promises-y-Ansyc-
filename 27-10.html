<body>

    <script>
        
    const datos =[ {
        id: 1,
        title: "Iron Man",
        year: 2008
    }, {
        id: 2,
        title: "Spider Man",
        year: 2017
    }, {
        id: 3,
        title: "Avengers",
        year: 2019
    }];

     const getDatos = () => {
        return new Promise((resolve, rejected) => {
         setTimeout(() => {
            resolve (datos);
        }, 1500 );
        })
    }

 //   getDatos()
   //     .then((datos) => console.log(getDatos()));
  async function fetchingData() {
    try {
        const datosFetched = await getDatos();
        console.log(datosFetched);
    } catch (err) {
        console.log(err);
    }
}

fetchingData();

    </script>
